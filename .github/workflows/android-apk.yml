name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        run: npm ci

      - name: Qualidade (typecheck + lint)
        run: |
          npx tsc --noEmit
          npx eslint . --max-warnings=0

      - name: Gerar projeto nativo (CNG)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Renomear APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-apk/ford-conecta-v${VERSION}.apk
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        with:
          name: ford-conecta-apk
          path: dist-apk/*.apk

      - name: Publicar no GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
